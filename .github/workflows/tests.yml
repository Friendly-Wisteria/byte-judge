name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 最小権限の原則（このワークフローは読み取りのみで十分）
permissions:
  contents: read

# 同一ブランチで新しい実行が始まったら、進行中の古い実行はキャンセル
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI には .env を置かないため、settings が必須としている値だけをここで与える。
      # テスト専用のダミー値であり、本番の値とは無関係。
      # ANTHROPIC_API_KEY は不要（テストは Claude API を呼ばず、クライアントを
      # モックする）。
      SECRET_KEY: dummy-secret-key-for-ci-only
      DEBUG: "False"
      VIEW_TEST_MODE: "False"
      # テストクライアントは平文でリクエストするため、DEBUG=False のままだと
      # SECURE_SSL_REDIRECT が全部を 301 にしてしまう。リダイレクト自体の検証は
      # HttpsRedirectIsWiredForTheProxyTests が override_settings で行う。
      SECURE_SSL_REDIRECT: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Lint with ruff
        run: uv run ruff check .

      # 「入力内容をサーバー側に残さない」ことの回帰テスト（apps/judge/tests/）を含む
      - name: Run Django tests
        run: uv run python manage.py test --verbosity 2
