version: 2
updates:
  # 1. Python の依存関係（uv プロジェクトなので "uv" を使用）
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Dependabot は cron ではなく interval で指定する。
      # timezone を指定できるので JST を直接書けばよい（9時間引く必要なし）。
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    # minor/patch は1つのPRにまとめる（レビュー負荷とPR乱立を軽減）
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. GitHub Actions（SHA ピン留めの更新追従）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
